name: Build APK Android (controle mobile)

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar deps + sincronizar (gera os arquivos do Capacitor/Cordova)
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android

      - name: Build do APK (debug)
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk BioDesk-controle.apk

      - name: Publicar no release "android-apk"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create android-apk BioDesk-controle.apk \
            --title "BioDesk — App Android (controle)" \
            --notes "APK do controlador mobile do BioDesk. Instale no Android (ative 'instalar de fontes desconhecidas'). Gerado automaticamente pelo CI." \
            --prerelease \
            || gh release upload android-apk BioDesk-controle.apk --clobber

      - name: Guardar como artefato (backup)
        uses: actions/upload-artifact@v4
        with:
          name: BioDesk-controle-apk
          path: BioDesk-controle.apk
